workflows:
  android-release-apk:
    name: Easy Loan Finance - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - easyloan_keystore
      flutter: 3.35.7
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Analyze (report only)
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build release APK
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: keystore 'easyloan_keystore' not found in Codemagic code signing identities."
            echo "Google Sign-In will not work without it. Upload easyloan-release.jks first."
            exit 1
          fi
          flutter build apk --release
          echo "APK signing certificate:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA256" || true
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log
