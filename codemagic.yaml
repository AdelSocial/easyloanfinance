workflows:
  android-release-apk:
    name: Easy Loan Finance - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.35.7
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Analyze (report only)
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log
